<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Square Off: a party trivia game. Win duels, take your neighbors' squares, own the board.">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box}
body{margin:0; font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Square Off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen game-show stage. Setup sheet, then the square board, then a two-clock duel arena. */
:root{
  color-scheme: dark;
  --bg:#130f1f; --bg2:#1b1630; --panel:#231d39; --line:#3a3159;
  --fg:#f5f0fb; --muted:#a69cc2;
  --gold:#ffc94d; --sea:#12223a; --land:#4b4470; --good:#33d18f; --warn:#ff9f43; --bad:#ff5d6c;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%, #2b2150 0%, transparent 70%);
  color:var(--fg); font-family:var(--body); font-size:15px; overflow:hidden;
}
#app{height:100%}
.screen{height:100%; display:flex; flex-direction:column; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:14px;}
button{font:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.btn{border:0; border-radius:10px; padding:10px 16px; font-weight:600; color:var(--fg); background:var(--panel); border:1px solid var(--line); display:inline-flex; align-items:center; gap:8px; justify-content:center; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.gold{background:var(--gold); color:#2a1d00; border-color:var(--gold)}
.btn.good{background:var(--good); color:#062417; border-color:var(--good)}
.btn.warn{background:transparent; color:var(--warn); border:2px solid var(--warn)}
.btn.ghost{background:transparent}
.btn.big{padding:14px 26px; font-size:1.15rem; border-radius:12px}
kbd{font-family:var(--mono); font-size:.72em; padding:2px 6px; border-radius:5px; background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.18)}
.btn.warn kbd{background:transparent}
.eyebrow{text-transform:uppercase; letter-spacing:.14em; font-size:.72rem; font-weight:700; color:var(--muted)}
.logo{font-family:var(--display); font-weight:800; letter-spacing:-.02em}
.logo b{color:var(--gold)}

/* ---------- Setup ---------- */
.setup{overflow-y:auto; display:block}
.hero{max-width:1100px; margin:8px auto 20px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px}
.hero .logo{font-size:clamp(2.6rem, 7vw, 4.6rem); line-height:.95; margin:0}
.hero p{margin:0; color:var(--muted); max-width:44ch; text-wrap:balance}
.setup-grid{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:18px}
.card{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:18px}
.card h2{font-family:var(--display); font-weight:800; font-size:1.25rem; margin:0 0 4px; display:flex; align-items:center; gap:10px}
.card .hint{color:var(--muted); margin:0 0 14px; font-size:.9rem}
.pill{font-family:var(--body); font-size:.72rem; font-weight:700; background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:2px 9px; color:var(--muted)}
.plist{display:flex; flex-direction:column; gap:8px}
.prow{display:grid; grid-template-columns:14px minmax(0,1fr) minmax(0,1fr) 34px; gap:8px; align-items:center}
.swatch{width:14px; height:34px; border-radius:4px}
input,select,textarea{font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; width:100%}
textarea{min-height:120px; resize:vertical; font-family:var(--mono); font-size:.82rem; line-height:1.5}
.x{background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; height:34px; font-size:1.1rem}
.x:hover{color:var(--bad); border-color:var(--bad)}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.side{display:flex; flex-direction:column; gap:18px; min-width:0}
.field{display:flex; flex-direction:column; gap:6px; flex:1; min-width:120px}
.field label{font-size:.8rem; color:var(--muted); font-weight:600}
.check{display:flex; gap:8px; align-items:center; color:var(--muted); font-size:.9rem; margin-top:12px}
.check input{width:auto}
.rules ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:7px; color:var(--muted); font-size:.92rem; line-height:1.45}
.rules b{color:var(--fg)}
.customs{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.custom-item{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 6px 6px 10px; font-size:.9rem}
.custom-item span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.startbar{max-width:1100px; margin:20px auto 8px; display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.err{color:var(--bad); font-weight:600}
@media (max-width:820px){ .setup-grid{grid-template-columns:minmax(0,1fr)} }

/* ---------- Board ---------- */
.bar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:baseline; gap:14px}
.brand .logo{font-size:1.8rem}
.tag{color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
.actions{display:flex; flex-wrap:wrap; gap:8px}
.actions .btn{padding:7px 12px; font-size:.88rem}
.callout{margin:14px 0 12px; min-height:58px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:center; text-align:center}
.callout .msg{font-size:1.15rem; font-weight:600; text-wrap:balance; max-width:60ch}
.callout .msg em{font-style:normal; color:var(--gold)}
.callout .sub{color:var(--muted); font-size:.9rem; width:100%}
.board-wrap{flex:1; min-height:0; display:grid; place-items:center}
.board{display:grid; --cs:100px}
.cell{border:4px solid var(--bg); position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:4px; overflow:hidden; cursor:pointer; transition:opacity .2s, filter .2s; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.45)}
.cell-name{font-family:var(--display); font-weight:800; font-size:calc(var(--cs) * .17); line-height:1.05; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word}
.cell-cat{font-size:calc(var(--cs) * .105); font-weight:600; opacity:.9; margin-top:3px; line-height:1.15; max-width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.cell-n{position:absolute; right:6px; bottom:4px; font-family:var(--mono); font-size:calc(var(--cs) * .09); opacity:.8}
.cell.dim{opacity:.28; filter:saturate(.5)}
.cell.chal{box-shadow:inset 0 0 0 4px var(--gold); filter:brightness(1.12)}
.cell.target{outline:3px dashed #fff; outline-offset:-10px}
.cell.target:hover{filter:brightness(1.2)}
.cell.flash{filter:brightness(1.35); box-shadow:inset 0 0 0 4px #fff}

/* ---------- Duel ---------- */
.duel-screen{position:relative}
.duel-head{text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px}
.duel-cat{font-family:var(--display); font-weight:800; font-size:clamp(1.6rem, 4.5vw, 2.8rem); margin:0; line-height:1.05; text-wrap:balance}
.arena{flex:1; min-height:0; display:grid; grid-template-columns:minmax(150px,1fr) minmax(0,2.6fr) minmax(150px,1fr); gap:16px; align-items:stretch; margin:14px 0}
.pl{background:var(--bg2); border:2px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; text-align:center; transition:border-color .2s, box-shadow .2s, opacity .2s; opacity:.55; min-width:0}
.pl.on{opacity:1; border-color:var(--c); box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 35%, transparent), 0 0 60px color-mix(in srgb, var(--c) 30%, transparent)}
.pl-role{font-size:.72rem; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--muted)}
.pl-name{font-family:var(--display); font-weight:800; font-size:clamp(1.2rem, 2.6vw, 2rem); line-height:1.05; color:var(--c); filter:brightness(1.35); word-break:break-word}
.clock{font-family:var(--mono); font-weight:700; font-size:clamp(2.4rem, 6vw, 4.6rem); font-variant-numeric:tabular-nums; line-height:1}
.clock.low{color:var(--bad); animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.55}}
.tbar{width:100%; height:8px; border-radius:99px; background:var(--bg); overflow:hidden}
.tbar i{display:block; height:100%; background:var(--c); border-radius:99px}
.stage{background:var(--bg2); border:1px solid var(--line); border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:18px; text-align:center; min-width:0; min-height:0; overflow:hidden; position:relative}
.turn{position:absolute; top:12px; left:0; right:0; font-weight:700; font-size:.95rem}
.prompt{color:var(--muted); font-weight:600; font-size:clamp(1rem, 2.2vw, 1.4rem)}
.clue{font-weight:800; line-height:1.1; max-width:100%; overflow-wrap:anywhere; text-wrap:balance}
.clue.emoji{font-family:var(--emoji); font-size:clamp(64px, 15vmin, 190px); line-height:1.15}
.clue.text{font-family:var(--display); font-size:clamp(34px, 8vmin, 104px)}
.clue.count{font-family:var(--emoji); font-size:clamp(30px, 6.4vmin, 70px); letter-spacing:.12em; line-height:1.3; max-width:18ch}
.clue.passing{opacity:.25}
.reveal{min-height:1.4em; font-family:var(--display); font-weight:800; font-size:clamp(1.4rem, 4vw, 2.6rem); color:var(--gold)}
.reveal.host{font-family:var(--body); font-weight:600; font-size:1rem; color:var(--muted)}
.last{position:absolute; bottom:12px; left:0; right:0; color:var(--muted); font-size:.95rem}
.last b{color:var(--good)}
.controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.overlay{position:absolute; inset:0; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(6px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; z-index:5}
.overlay h2{font-family:var(--display); font-weight:800; font-size:clamp(1.8rem, 5vw, 3.4rem); margin:0; line-height:1.05; text-wrap:balance}
.overlay p{margin:0; color:var(--muted); font-size:1.1rem}
.cd{font-family:var(--display); font-weight:800; font-size:clamp(6rem, 22vmin, 14rem); color:var(--gold); line-height:1}
.who{color:#fff; border:0}
@media (max-width:760px){
  .arena{grid-template-columns:1fr 1fr; grid-template-rows:auto minmax(0,1fr); gap:10px}
  .stage{grid-column:1 / -1; grid-row:2}
  .pl{padding:10px}
  .controls .btn.ghost{padding:7px 10px; font-size:.85rem}
  kbd{display:none}
}

/* ---------- Champion ---------- */
.champ{position:relative; align-items:center; justify-content:center; text-align:center}
.champ canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.champ-inner{position:relative; display:flex; flex-direction:column; align-items:center; gap:14px}
.champ h1{font-family:var(--display); font-weight:800; font-size:clamp(3rem, 12vw, 8rem); margin:0; line-height:.95; color:var(--c); filter:brightness(1.3); text-wrap:balance}
.champ p{margin:0; font-size:1.3rem; color:var(--muted)}
/* ---------- Photo categories ---------- */
.tabs{display:flex; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:4px; margin-bottom:12px}
.tab{flex:1; background:transparent; border:0; color:var(--muted); font-weight:600; padding:7px 10px; border-radius:7px}
.tab[aria-selected="true"]{background:var(--panel); color:var(--fg)}
.drop{display:flex; flex-direction:column; align-items:center; gap:4px; border:2px dashed var(--line); border-radius:12px; padding:18px 12px; text-align:center; color:var(--muted); cursor:pointer; font-size:.9rem}
.drop.over,.drop:hover{border-color:var(--gold); color:var(--fg)}
.drop strong{color:var(--gold); font-size:1rem}
.drop input{display:none}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:8px; margin-top:10px; max-height:440px; overflow-y:auto}
.pgrid:empty{display:none}
.ph{position:relative; display:flex; flex-direction:column; gap:4px; min-width:0}
.ph img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; background:var(--bg); display:block}
.ph input{padding:5px 7px; font-size:.82rem}
.ph input.missing{border-color:var(--warn)}
.ph .x{position:absolute; top:4px; right:4px; width:26px; height:26px; background:rgba(0,0,0,.65); border:0; color:#fff; font-size:.95rem; line-height:1; padding:0}
.busy{grid-column:1 / -1; color:var(--muted); font-size:.85rem}
.custom-item .row{flex-wrap:nowrap; gap:6px}
.custom-item .btn{padding:4px 10px; font-size:.82rem}
.stage.has-photo{padding-block:42px 38px}
.clue.photo{flex:1; min-height:0; width:100%; position:relative}
.clue.photo img{position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%; object-fit:contain; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.45)}
.clue.photo.passing{opacity:.35}
.clue.photo .missing-ph{position:absolute; inset:0; display:grid; place-items:center; font-size:1.2rem; color:var(--muted)}
.clue.state{flex:1; min-height:0; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px}
.clue.state svg{flex:1; min-height:0; width:100%; max-height:52vh; overflow:visible}
.clue.state path{fill:var(--gold); stroke:#fff; stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round; filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.clue.state .state-name{font-family:var(--display); font-weight:800; font-size:clamp(30px, 6.5vmin, 76px); line-height:1}
.clue.state.passing{opacity:.35}
.clue.world{flex:1; min-height:0; width:100%; position:relative}
.clue.world svg{position:absolute; inset:0; width:100%; height:100%; background:var(--sea); border-radius:14px}
.clue.world path{fill:var(--land); stroke:var(--bg2); stroke-width:1; vector-effect:non-scaling-stroke}
.clue.world path.hit{fill:var(--gold); stroke:#fff; stroke-width:2}
.clue.world.passing{opacity:.35}
@media (prefers-reduced-motion:reduce){ .clock.low{animation:none} *{transition:none!important} }
</style>
</head>

function tone(f, d, type = 'sine', vol = .15, delay = 0){
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
  } catch {}
}

const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('squareoff', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const tx = db.transaction('img', mode); const out = fn(tx.objectStore('img')); tx.oncomplete = () => res(out && out.v); tx.onerror = () => rej(tx.error); }); };
  return {
    put: (k, v) => run('readwrite', s => { s.put(v, k); }),
    del: k => run('readwrite', s => { s.delete(k); }),
    getAll: () => run('readonly', s => { const out = {v:{}}; const req = s.openCursor(); req.onsuccess = () => { const c = req.result; if (c){ out.v[c.key] = c.value; c.continue(); } }; return out; }),
  };
})();

function worldSVG(name){
  const W = SHAPES.world, t = W && W.t[name];
  if (!t) return '';
  const k = Math.cos(t.lat * Math.PI / 180);
  const x0 = t.b[0] * k, x1 = t.b[2] * k, y0 = t.b[1], y1 = t.b[3];
  const w = x1 - x0, h = y1 - y0, half = Math.max(w, h) / 2 + 0.7 * Math.max(w, h, 6);
  const hw = half * 4 / 3, vx = (x0 + x1) / 2 - hw, vy = (y0 + y1) / 2 - half, vw = 2 * hw, vh = 2 * half;
  let paths = '';
  for (const [n, c] of Object.entries(W.c)){
    if (n === t.k) continue;
    const b = c.b;
    if (b[2] * k < vx - vw / 3 || b[0] * k > vx + vw * 4 / 3 || b[3] < vy - vh / 3 || b[1] > vy + vh * 4 / 3) continue;
    paths += `<path d="${c.d}"/>`;
  }
  paths += `<path class="hit" d="${W.c[t.k].d}"/>`;
  return `<svg viewBox="${vx} ${vy} ${vw} ${vh}" aria-hidden="true"><g transform="scale(${k} 1)">${paths}</g></svg>`;
}

function guessAnswer(name){
  let s = name.replace(/\.[^.]+$/, '');
  if (/^(img|dsc|dscn|pxl|photo|image|screenshot|screen shot|whatsapp)[\s_-]?/i.test(s) || /^[\d\s_-]+$/.test(s)) return '';
  s = s.replace(/[_-]+/g, ' ').replace(/\s*\(\d+\)$/, '').replace(/\s+\d+$/, '').trim();
  return s ? s[0].toUpperCase() + s.slice(1) : '';
}
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .82);
  } finally { URL.revokeObjectURL(url); }
}

       challenger:null, lastWinner:null, msg:'', history:[]};
  saveGame(); requestWake(); render();
}

/* ================= Board ================= */
function neighbors(pid){
  const out = new Set(), n = S.cells.length, cols = S.cols;
  S.cells.forEach((o, i) => {
    if (o !== pid) return;
    const c = i % cols, adj = [i - cols, i + cols];
    if (c > 0) adj.push(i - 1);
    if (c < cols - 1) adj.push(i + 1);
    adj.forEach(j => { if (j >= 0 && j < n && S.cells[j] !== pid) out.add(S.cells[j]); });
  });
  return out;
}

    </header>
    <div class="callout" id="callout"></div>
    <div class="board-wrap" id="bw"><div class="board" id="board"></div></div>
  </div>`;
  const u = $('#undo'); if (u) u.onclick = undo;
  $('#snd').onclick = () => { soundOn = !soundOn; store.set('sq_sound', soundOn); renderBoard(); };
  $('#fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch {} };
  $('#setup').onclick = () => { renderSetup(); };
  $('#board').addEventListener('click', onCellClick);
  paintCallout(); paintBoard(); sizeBoard();
}

function paintCallout(){
  const el = $('#callout'); if (!el) return;
  if (picking){ el.innerHTML = `<div class="msg">Picking a player…</div>`; return; }
  if (S.challenger){
    const c = pl(S.challenger);
    el.innerHTML = `<div class="msg"><em>${esc(c.name)}</em>, pick a neighbor to challenge.</div>
      <button class="btn ghost" id="cancelC">Choose someone else</button>
      <div class="sub">Tap a square with a dashed outline. You'll play in that player's category.</div>`;
    $('#cancelC').onclick = () => { S.challenger = null; saveGame(); paintCallout(); paintBoard(); };
    return;
  }
  const w = S.lastWinner && pl(S.lastWinner);
  el.innerHTML = `${S.msg ? `<div class="msg">${S.msg}</div>` : ''}
    <div class="row" style="justify-content:center">
      <button class="btn gold big" id="rand">Pick a random player</button>
      ${w && w.alive ? `<button class="btn big" id="again">${esc(w.name)} challenges again</button>` : ''}
    </div>
    <div class="sub">Or tap any square to choose who challenges next.</div>`;
  $('#rand').onclick = randomPick;
  const a = $('#again'); if (a) a.onclick = () => { S.challenger = w.id; saveGame(); paintCallout(); paintBoard(); };
}

function paintBoard(){
  const b = $('#board'); if (!b) return;
  const cols = S.cols, n = S.cells.length, home = {}, counts = {};
  S.cells.forEach((o, i) => { if (!(o in home)) home[o] = i; counts[o] = (counts[o] || 0) + 1; });
  const targets = S.challenger ? neighbors(S.challenger) : null;
  b.style.gridTemplateColumns = `repeat(${cols}, var(--cs))`;
  b.innerHTML = S.cells.map((o, i) => {
    const p = pl(o), c = i % cols, same = j => j >= 0 && j < n && S.cells[j] === o;
    const bt = same(i - cols), bb = same(i + cols), bl = c > 0 && same(i - 1), br = c < cols - 1 && same(i + 1);
    const bc = x => x ? p.color : 'var(--bg)';
    let cls = 'cell';
    if (flashId) cls += o === flashId ? ' flash' : ' dim';
    else if (S.challenger){ if (o === S.challenger) cls += ' chal'; else if (targets.has(o)) cls += ' target'; else cls += ' dim'; }
    const label = home[o] === i ? `<div class="cell-name">${esc(p.name)}</div><div class="cell-cat">${esc(catName(p.cat))}</div>${counts[o] > 1 ? `<span class="cell-n">${counts[o]}</span>` : ''}` : '';
    return `<div class="${cls}" data-o="${o}" style="background:${p.color};border-color:${bc(bt)} ${bc(br)} ${bc(bb)} ${bc(bl)}" title="${esc(p.name)} · ${esc(catName(p.cat))}">${label}</div>`;
  }).join('');
}

function sizeBoard(){
  const bw = $('#bw'), b = $('#board'); if (!bw || !b || !S) return;
  const r = bw.getBoundingClientRect(), rows = Math.ceil(S.cells.length / S.cols);
  const cs = Math.max(40, Math.floor(Math.min(r.width / S.cols, r.height / rows)));
  b.style.setProperty('--cs', cs + 'px');
  b.style.gridAutoRows = cs + 'px';
}
window.addEventListener('resize', sizeBoard);

function onCellClick(e){
  const cell = e.target.closest('.cell'); if (!cell || picking) return;
  const o = cell.dataset.o;
  if (!S.challenger){ S.challenger = o; saveGame(); paintCallout(); paintBoard(); return; }
  if (o === S.challenger) return;
  if (neighbors(S.challenger).has(o)) startDuel(S.challenger, o);
}

function randomPick(){
  if (picking) return;
  const alive = shuffle(alivePlayers());
  picking = true; paintCallout();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let steps = reduce ? 1 : 16 + rand(alive.length), i = 0, delay = 55;
  const step = () => {
    flashId = alive[i % alive.length].id; paintBoard(); sfx.blip();
    i++; steps--;
    if (steps > 0){ delay *= 1.12; setTimeout(step, delay); }
    else setTimeout(() => { S.challenger = flashId; flashId = null; picking = false; saveGame(); sfx.ding(); paintCallout(); paintBoard(); }, reduce ? 0 : 450);
  };
  step();
}

function pushHistory(){
  const snap = JSON.stringify({...S, history:[]});
  S.history.push(snap); if (S.history.length > 25) S.history.shift();
}
function undo(){
  if (!S.history.length) return;
  const h = S.history.slice(0, -1), prev = JSON.parse(S.history[S.history.length - 1]);
  S = {...prev, history:h, phase:'board', challenger:null, msg:'Last duel undone.'};
  saveGame(); render();
}

/* ================= Duel ================= */
function drawClue(catId){
  const c = cat(catId);
  if (c.gen) return c.gen();
  if (!c.items || !c.items.length) return drawClue(BUILTIN[0].id);
  const used = S.used[catId] || (S.used[catId] = []);
  const ok = i => !c.items[i][0].startsWith('img:') || imgs[c.items[i][0].slice(4)];
  let i;
  for (let tries = 0; tries <= c.items.length; tries++){
    if (used.length >= c.items.length) used.length = 0;
    do { i = rand(c.items.length); } while (used.includes(i));
    used.push(i);
    if (ok(i)) break;
  }
  return {q:c.items[i][0], a:c.items[i][1], p:c.prompt || ''};
}

function startDuel(aId, bId){
  const ms = S.seconds * 1000;
  D = {a:aId, b:bId, cat:pl(bId).cat, chalCat:pl(aId).cat, time:{[aId]:ms, [bId]:ms}, max:ms,
       active:null, phase:'pick', clue:null, passUntil:0, last:'', showAns:false, beeped:{}};
  S.phase = 'duel'; S.challenger = null;
  render();
}

function renderDuel(){
  const a = pl(D.a), b = pl(D.b), c = cat(D.cat);
  const panel = (p, role, k) => `<div class="pl" id="pl${k}" style="--c:${p.color}">
      <div class="pl-role">${role}</div><div class="pl-name">${esc(p.name)}</div>
      <div class="clock" id="clk${k}"></div><div class="tbar"><i id="bar${k}"></i></div></div>`;
  app.innerHTML = `
  <div class="screen duel-screen">
    <div class="duel-head"><span class="eyebrow">Duel category</span><h1 class="duel-cat">${esc(c.name)}</h1></div>
    <div class="arena">
      ${panel(a, 'Challenger', 'A')}
      <div class="stage${['photo', 'state', 'world'].includes(c.style) ? ' has-photo' : ''}">
        <div class="turn" id="turn"></div>
        <div class="prompt" id="prompt"></div>
        <div class="clue ${c.style || 'text'}" id="clue"></div>
        <div class="reveal" id="reveal"></div>
        <div class="last" id="last"></div>
      </div>
      ${panel(b, 'Defender', 'B')}
    </div>
    <div class="controls">
      <button class="btn good big" id="bOk">Correct <kbd>Space</kbd></button>
      <button class="btn warn big" id="bPass">Pass <kbd>P</kbd></button>
      <button class="btn ghost" id="bSkip">Skip bad clue <kbd>S</kbd></button>
      <button class="btn ghost" id="bAns">Show answer to host <kbd>A</kbd></button>
      <button class="btn ghost" id="bPause">Pause <kbd>Esc</kbd></button>
    </div>
    <div class="overlay" id="ov" hidden></div>
  </div>`;
  $('#bOk').onclick = correct; $('#bPass').onclick = pass; $('#bSkip').onclick = skip;
  $('#bAns').onclick = toggleAns; $('#bPause').onclick = togglePause;
  paintDuel(); updateClocks();
}

const fmt = ms => (Math.max(0, ms) / 1000).toFixed(1);
function updateClocks(){
  if (!D) return;
  ['A','B'].forEach(k => {
    const id = k === 'A' ? D.a : D.b, t = D.time[id], el = $('#clk' + k), bar = $('#bar' + k);
    if (!el) return;
    el.textContent = fmt(t);
    el.classList.toggle('low', t < 5000 && D.active === id && (D.phase === 'run' || D.phase === 'pass'));
    bar.style.width = (100 * Math.max(0, t) / D.max) + '%';
  });
}

function paintDuel(){
  if (!D || !$('#clue')) return;
  $('#plA').classList.toggle('on', D.active === D.a);
  $('#plB').classList.toggle('on', D.active === D.b);
  const live = D.phase === 'run' || D.phase === 'pass';
  $('#turn').innerHTML = live && D.active ? `<span style="color:${pl(D.active).color};filter:brightness(1.4)">${esc(pl(D.active).name)}</span> is on the clock` : '';
  $('#prompt').textContent = live && D.clue ? (D.clue.p || '') : '';
  const clue = $('#clue');
  const cs = cat(D.cat).style || 'text', SH = SHAPES[cat(D.cat).shapes || 'states'] || {}, noLabel = cat(D.cat).shapes === 'countries';
  clue.className = 'clue ' + (cs === 'auto' ? (D.clue && /[A-Za-z0-9]/.test(D.clue.q) ? 'text' : 'emoji') : cs === 'state' && !(D.clue && SH[D.clue.q]) ? 'text' : cs);
  if (live && D.clue && cs === 'world'){
    if (clue.dataset.q !== D.clue.q){ const svg = worldSVG(D.clue.q); clue.innerHTML = svg || '<div class="missing-ph">Map still loading. Press Skip.</div>'; clue.dataset.q = svg ? D.clue.q : ''; }
  } else if (live && D.clue && cs === 'state' && noLabel && !SH[D.clue.q]){
    clue.textContent = 'Map still loading. Press Skip.'; clue.dataset.q = '';
  } else if (live && D.clue && cs === 'state' && SH[D.clue.q]){
    if (clue.dataset.q !== D.clue.q){ const st = SH[D.clue.q]; clue.innerHTML = `<svg viewBox="${st.vb}" aria-hidden="true"><path d="${st.d}" fill-rule="evenodd"/></svg>${noLabel ? '' : `<div class="state-name">${esc(D.clue.q)}</div>`}`; }
    clue.dataset.q = D.clue.q;
  } else if (live && D.clue && cs === 'photo'){
    const qq = String(D.clue.q), bank = qq.startsWith('pb:'), u = bank ? pbUrl(qq) : imgs[qq.slice(4)];
    if (clue.dataset.q !== D.clue.q) clue.innerHTML = u ? `<img src="${u}" alt="">` : `<div class="missing-ph">${bank ? 'Loading photos…' : 'Photo missing. Press Skip.'}</div>`;
    clue.dataset.q = u ? D.clue.q : '';
  } else { clue.textContent = live && D.clue ? D.clue.q : ''; clue.dataset.q = ''; }
  clue.classList.toggle('passing', D.phase === 'pass');
  const rv = $('#reveal');
  if (D.phase === 'pass'){ rv.className = 'reveal'; rv.textContent = D.clue.a || '(no answer)'; }
  else if (D.showAns && live && D.clue){ rv.className = 'reveal host'; rv.textContent = 'Answer: ' + (D.clue.a || '—'); }
  else { rv.className = 'reveal'; rv.textContent = ''; }
  $('#last').innerHTML = D.last ? `Last answer: <b>${esc(D.last)}</b>` : '';
  $('#bOk').disabled = D.phase !== 'run';
  $('#bPass').disabled = D.phase !== 'run';
  $('#bSkip').disabled = D.phase !== 'run';
  $('#bAns').textContent = '';
  $('#bAns').insertAdjacentHTML('beforeend', `${D.showAns ? 'Hide answer' : 'Show answer to host'} <kbd>A</kbd>`);
  $('#bPause').innerHTML = `${D.phase === 'paused' ? 'Resume' : 'Pause'} <kbd>Esc</kbd>`;
  paintOverlay();
}

function paintOverlay(){
  const ov = $('#ov'), a = pl(D.a), b = pl(D.b);
  const whoBtn = (p, id) => `<button class="btn big who" id="${id}" style="background:${p.color}">${esc(p.name)}</button>`;
  if (D.phase === 'pick'){
    ov.hidden = false;
    ov.innerHTML = `<span class="eyebrow">${esc(a.name)} vs ${esc(b.name)} · ${esc(catName(D.cat))}</span>
      <h2>Who goes first?</h2>
      <div class="row" style="justify-content:center">${whoBtn(a, 'firstA')}${whoBtn(b, 'firstB')}</div>
      <button class="btn ghost" id="cancelD">Cancel duel</button>`;
    $('#firstA').onclick = () => countdown(D.a);
    $('#firstB').onclick = () => countdown(D.b);
    $('#cancelD').onclick = cancelDuel;
  } else if (D.phase === 'count'){
    ov.hidden = false;
    ov.innerHTML = `<p>${esc(pl(D.active).name)} starts</p><div class="cd" id="cd">${D.cd}</div>`;
  } else if (D.phase === 'paused'){
    ov.hidden = false;
    ov.innerHTML = `<h2>Paused</h2>
      <button class="btn gold big" id="resumeD">Resume <kbd>Esc</kbd></button>
      <p>Need to fix something? End the duel by hand:</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="winA">${esc(a.name)} wins</button>
        <button class="btn" id="winB">${esc(b.name)} wins</button>
        <button class="btn ghost" id="cancelD">Cancel duel, no change</button>
      </div>`;
    $('#resumeD').onclick = togglePause;
    $('#winA').onclick = () => endDuel(D.a);
    $('#winB').onclick = () => endDuel(D.b);
    $('#cancelD').onclick = cancelDuel;
  } else if (D.phase === 'done'){
    const w = pl(D.winner), l = pl(D.winner === D.a ? D.b : D.a);
    ov.hidden = false;
    ov.innerHTML = `<span class="eyebrow">Time's up for ${esc(l.name)}</span>
      <h2><span style="color:${w.color};filter:brightness(1.4)">${esc(w.name)}</span> wins the duel</h2>
      <p>${esc(l.name)} is out. ${esc(w.name)} takes their squares.</p>
      <button class="btn gold big" id="backB">Back to the board <kbd>Enter</kbd></button>`;
    $('#backB').onclick = finishDuel;
    $('#backB').focus();
  } else { ov.hidden = true; ov.innerHTML = ''; }
}

function countdown(first){
  D.active = first; D.phase = 'count'; D.cd = 3; paintDuel(); sfx.blip();
  const t = setInterval(() => {
    if (!D || D.phase !== 'count'){ clearInterval(t); return; }
    D.cd--;
    if (D.cd > 0){ const el = $('#cd'); if (el) el.textContent = D.cd; sfx.blip(); }
    else { clearInterval(t); sfx.go(); D.phase = 'run'; D.clue = drawClue(D.cat); paintDuel(); }
  }, 750);
}

function correct(){
  if (!D || D.phase !== 'run') return;
  sfx.ding(); D.last = D.clue.a || D.clue.q;
  D.active = D.active === D.a ? D.b : D.a;
  D.clue = drawClue(D.cat); paintDuel();
}
function pass(){
  if (!D || D.phase !== 'run') return;
  sfx.pass(); D.phase = 'pass'; D.passUntil = performance.now() + S.pass * 1000; paintDuel();
}
function skip(){
  if (!D || D.phase !== 'run') return;
  D.clue = drawClue(D.cat); paintDuel();
}
function toggleAns(){ if (!D) return; D.showAns = !D.showAns; paintDuel(); }
function togglePause(){
  if (!D) return;
  if (D.phase === 'run' || D.phase === 'pass'){ D.prev = D.phase; D.pausedAt = performance.now(); D.phase = 'paused'; }
  else if (D.phase === 'paused'){ D.phase = D.prev; if (D.prev === 'pass') D.passUntil += performance.now() - D.pausedAt; }
  else return;
  paintDuel(); updateClocks();
}
function endDuel(winner){
  D.winner = winner; D.phase = 'done'; D.active = null;
  sfx.buzz(); saveGame(); paintDuel(); updateClocks();
}
function cancelDuel(){ D = null; S.phase = 'board'; saveGame(); render(); }

function finishDuel(){
  if (!D || D.phase !== 'done') return;
  const w = pl(D.winner), l = pl(D.winner === D.a ? D.b : D.a), wasChallenger = D.winner === D.a;
  pushHistory();
  S.cells = S.cells.map(o => o === l.id ? w.id : o);
  l.alive = false;
  w.cat = D.chalCat; // the category that wasn't played stays in the game
  S.lastWinner = w.id;
  S.msg = wasChallenger
    ? `<em>${esc(w.name)}</em> knocked out ${esc(l.name)} and still defends <em>${esc(catName(w.cat))}</em>.`
    : `<em>${esc(w.name)}</em> held off ${esc(l.name)} and now defends <em>${esc(catName(w.cat))}</em>.`;
  D = null;
  S.phase = alivePlayers().length === 1 ? 'champ' : 'board';
  saveGame(); render();
}

let lastT = 0;
function tick(t){
  requestAnimationFrame(tick);
  const dt = lastT ? Math.min(t - lastT, 250) : 0; lastT = t;
  if (!D || !(D.phase === 'run' || D.phase === 'pass')) return;
  const id = D.active;
  D.time[id] -= dt;
  const sec = Math.ceil(D.time[id] / 1000);
  if (sec <= 5 && sec > 0 && D.beeped[id] !== sec){ D.beeped[id] = sec; sfx.tick(); }
  if (D.time[id] <= 0){ D.time[id] = 0; endDuel(id === D.a ? D.b : D.a); return; }
  if (D.phase === 'pass' && t >= D.passUntil){ D.phase = 'run'; D.last = ''; D.clue = drawClue(D.cat); paintDuel(); }
  updateClocks();
}
requestAnimationFrame(tick);

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (!D) return;
  const k = e.key.toLowerCase();
  if (D.phase === 'done' && k === 'enter'){ e.preventDefault(); finishDuel(); return; }
  if (k === ' ' || k === 'enter' || k === 'arrowright'){ e.preventDefault(); correct(); }
  else if (k === 'p'){ pass(); }
  else if (k === 's'){ skip(); }
  else if (k === 'a'){ toggleAns(); }
  else if (k === 'escape'){ togglePause(); }
});

/* ================= Champion ================= */
function renderChamp(){
  const w = alivePlayers()[0];
  app.innerHTML = `
  <div class="screen champ" style="--c:${w.color}">
    <canvas id="conf"></canvas>
    <div class="champ-inner">
      <span class="eyebrow">Owns the whole board</span>
      <h1>${esc(w.name)}</h1>
      <p>is the Square Off champion</p>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="btn gold big" id="again">Play again, same players</button>
        <button class="btn" id="change">Change players</button>
        ${S.history.length ? '<button class="btn ghost" id="undo">Undo last duel</button>' : ''}
      </div>
    </div>
  </div>`;
  $('#again').onclick = startGame;
  $('#change').onclick = () => { S.phase = 'setup'; saveGame(); render(); };
  const u = $('#undo'); if (u) u.onclick = undo;
  sfx.fanfare(); confetti();
}
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#conf'); if (!cv) return;
  const ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  const W = cv.width = cv.clientWidth * dpr, H = cv.height = cv.clientHeight * dpr;
  const parts = Array.from({length:220}, () => ({x:Math.random() * W, y:-Math.random() * H, vx:(Math.random() - .5) * 2 * dpr, vy:(2 + Math.random() * 3) * dpr, s:(5 + Math.random() * 7) * dpr, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:pick([...COLORS.slice(0, 10), '#ffc94d', '#ffffff'])}));
  const end = performance.now() + 7000;
  (function frame(now){
    if (!document.body.contains(cv)) return;
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; if (p.y > H && now < end) { p.y = -20; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (parts.some(p => p.y < H)) requestAnimationFrame(frame);
  })(performance.now());
}

/* ================= Wake lock & boot ================= */
async function requestWake(){ try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && S.phase !== 'setup') requestWake(); });
if (S && S.phase === 'duel') S.phase = 'board';
(async () => {
  try { imgs = await Promise.race([idb.getAll(), new Promise((_, rej) => setTimeout(rej, 2500))]) || {}; } catch {}
  render();
})();
</script>
